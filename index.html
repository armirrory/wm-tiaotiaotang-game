<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>跳跳糖 · 小游戏</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#f2e3b8;
    font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif; touch-action:none;
    -webkit-user-select:none; user-select:none; }
  #stage { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); }
  canvas { display:block; width:100%; height:100%; image-rendering:auto; }
  .ov { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:26px; background-repeat:repeat-y; background-size:100% auto;
    background-color:#fff; z-index:5; }
  .hidden { display:none !important; }
  #titleImg { width:72%; max-width:460px; filter:drop-shadow(0 6px 0 rgba(0,0,0,.08)); }
  .btn { border:none; cursor:pointer; font-weight:900; color:#fff; letter-spacing:4px;
    background:#ffd633; -webkit-text-stroke:1px #333; padding:16px 58px; font-size:34px;
    border-radius:999px; box-shadow:0 6px 0 #d8a900, 0 10px 18px rgba(0,0,0,.18);
    text-shadow:0 2px 0 rgba(0,0,0,.25); transition:transform .08s; }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 #d8a900; }
  .btn.small { font-size:24px; padding:10px 36px; letter-spacing:2px; }
  .hint { font-size:19px; color:#666; background:rgba(255,255,255,.85); padding:8px 20px;
    border-radius:999px; }
  .stat { font-size:26px; color:#333; font-weight:700; background:rgba(255,255,255,.9);
    padding:10px 26px; border-radius:16px; box-shadow:0 4px 12px rgba(0,0,0,.10); }
  .stat b { color:#e65100; font-size:34px; }
  #hud { position:absolute; inset:0; pointer-events:none; z-index:4; display:none; }
  .icobtn { position:absolute; top:14px; width:52px; height:52px; border:none; border-radius:50%;
    background:rgba(0,0,0,.28); color:#fff; font-size:24px; pointer-events:auto; cursor:pointer;
    display:flex; align-items:center; justify-content:center; backdrop-filter:blur(2px); }
  #btnSound { left:14px; } #btnPause { right:14px; }
  #overTitle { font-size:44px; font-weight:900; color:#333; -webkit-text-stroke:1px #fff; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="800" height="1500"></canvas>

  <div id="hud">
    <button id="btnSound" class="icobtn">🔊</button>
    <button id="btnPause" class="icobtn">⏸</button>
  </div>

  <div id="ovStart" class="ov">
    <img id="titleImg" alt="跳跳糖">
    <button id="btnStart" class="btn">开始游戏</button>
    <div id="bestStart" class="stat">最高纪录 <b id="bestVal">0</b> m</div>
    <div class="hint">拖动 / ←→ 移动，对准精灵球往上跳</div>
  </div>

  <div id="ovPause" class="ov hidden">
    <div id="overTitle">暂停中</div>
    <button id="btnResume" class="btn">继续</button>
    <button id="btnRestart1" class="btn small">重新开始</button>
  </div>

  <div id="ovOver" class="ov hidden">
    <div id="overTitle">游戏结束</div>
    <div class="stat">本局高度 <b id="scoreVal">0</b> m</div>
    <div class="stat">最高纪录 <b id="bestVal2">0</b> m</div>
    <button id="btnAgain" class="btn">再来一次</button>
    <button id="btnHome" class="btn small">回首页</button>
  </div>
</div>

var W=800, H=1500;
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var stage=document.getElementById('stage');
function resize(){
  var s=Math.min(innerWidth/W, innerHeight/H);
  stage.style.width=(W*s)+'px'; stage.style.height=(H*s)+'px';
}
addEventListener('resize',resize); resize();

var imgBg=new Image(), imgTitle=new Image(), imgPlayer=new Image(),
    imgBall=new Image(), imgCoin=new Image();
var bgPat=null, loaded=0, need=5;
function ld(im,src,cb){ im.onload=function(){ if(++loaded===need && cb)cb(); }; im.src=src; }
imgBg.src=IMG_BG; imgTitle.src=IMG_TITLE; imgPlayer.src=IMG_PLAYER;

// ---------- audio ----------
var bgm=new Audio(); bgm.loop=true; bgm.volume=.5; bgm.src='bgm.mp3';
var muted = localStorage.getItem('wm_mute')==='1';
var actx=null;
function ding(){
  if(muted) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    var t=actx.currentTime, o=actx.createOscillator(), g=actx.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(760,t);
    o.frequency.exponentialRampToValueAtTime(1250,t+.09);
    g.gain.setValueAtTime(.16,t); g.gain.exponentialRampToValueAtTime(.001,t+.18);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+.2);
  }catch(e){}
}

// ---------- game state ----------
var G=2400, JUMP=1200, PW=112, PH=84;           // casual: fixed size + hop ~300px (lands on next ball)
var ST='start';                                  // start | play | pause | over
var p, plats, camTop, maxAlt, best, groundY, coinBonus;
var platBallH=74, platCoinH=64;
best = parseInt(localStorage.getItem('wm_best')||'0',10)||0;

function rnd(a,b){ return a + Math.random()*(b-a); }
var platSeq=0;
function makePlat(x,y,type){
  var o={id:platSeq++, x:x, y:y, type:type, vx:0, r:(type==='slide'?platCoinH:platBallH)/2};
  if(type==='slide') o.vx = rnd(35,80) * (Math.random()<.5?-1:1);
  return o;
}
function altitudeOf(y){ return Math.max(0, Math.floor((groundY - y)/100)); }
function genUpTo(topY){
  var gapMax = Math.min(142, 122 + altitudeOf(p.y)*0.025);
  var slideP  = Math.min(.20, .06 + altitudeOf(p.y)*0.0003);
  // 整体球量约为上一版(1主+42%双 ≈1.42/层)的一半: 每层约 71% 放一颗主球, 偶尔整层不放;
  // 但绝不连续两空(否则三层跨度会超出一跳高度导致接不到), 且跳空后那颗用紧凑 gap 把总跨度收进一跳内
  while(plats.top > topY){
    var willSkip = (!plats.skipArmed) && (plats.list.length >= 5) && (Math.random() < 0.41);
    var gap = willSkip ? rnd(80, 112) : rnd(80, gapMax);
    var y = plats.top - gap;
    if(willSkip){
      plats.skipArmed = true;             // 记一笔: 下一颗必须放、且把 gap 收到一跳范围内
    } else {
      // 主球: 沿"可达阶梯"放在上一层附近(±110), 逼近屏幕边缘则回弹 -> 始终在中央安全带内左右摆动
      var lowB=150, hiB=650;
      var dx = rnd(-110, 110);
      var x1 = plats.lastX + dx;
      if(x1 < lowB){ dx = Math.abs(dx); x1 = plats.lastX + dx; }
      if(x1 > hiB){ dx = -Math.abs(dx); x1 = plats.lastX + dx; }
      x1 = Math.max(lowB, Math.min(hiB, x1));
      var t1 = Math.random() < slideP ? 'slide' : 'normal';
      plats.list.push(makePlat(x1, y, t1));
      plats.lastX = x1;
      plats.skipArmed = false;
    }
    plats.top = y;
  }
}
// 平台顶端 y (玩家踩在球的顶端, 不是底端)
function platTop(q){
  if(q.type==='ground') return q.y-26;          // 地面: roundRect 顶部
  if(q.type==='slide')  return q.y-platCoinH;   // 星币
  return q.y-platBallH;                          // 精灵球
}
// 水平命中半宽 (手动模式放宽, 擦边也能踩上; 稀疏球阵下更宽容)
function platHalf(q){
  if(q.type==='ground') return W/2 + 80;   // 地面铺满全屏: 任何 x 落回都能接住, 不会从边缘漏下去
  if(q.type==='slide')  return platCoinH/2+92;
  return platBallH/2+95;
}
// 返回 y 上方(更小 y)最近、且未被吃掉的球/币
function nearestAbove(y){
  var best=null;
  for(var i=0;i<plats.list.length;i++){
    var o=plats.list[i];
    if(o.gone) continue;
    if(o.y < y){ if(best===null || o.y > best.y) best=o; }
  }
  return best;
}
// 成绩 = 高度 + 金币奖励
function scoreNow(){ return maxAlt + coinBonus; }
function reset(){
  groundY = 1360; coinBonus = 0;
  p = { x:W/2, y:groundY-PH/2-40, vy:-JUMP, px:0 };
  plats = { list:[], top:0, lastX:W/2, skipArmed:false };
  plats.list.push({x:W/2, y:groundY, type:'ground', vx:0, r:250});
  plats.top = groundY;
  genUpTo(-900);
  camTop = 0; maxAlt = 0;
}

// ---------- controls ----------
var targetX=null, kbL=false, kbR=false;
function toWorldX(clientX){
  var r=cv.getBoundingClientRect();
  return (clientX-r.left)/r.width*W;
}
cv.addEventListener('pointerdown', function(e){ if(ST==='play'){ targetX=toWorldX(e.clientX); e.preventDefault(); }});
cv.addEventListener('pointermove', function(e){ if(ST==='play' && targetX!==null){ targetX=toWorldX(e.clientX); e.preventDefault(); }});
addEventListener('pointerup', function(){ targetX=null; });
addEventListener('keydown', function(e){
  if(e.key==='ArrowLeft'||e.key==='a') kbL=true;
  if(e.key==='ArrowRight'||e.key==='d') kbR=true;
});
addEventListener('keyup', function(e){
  if(e.key==='ArrowLeft'||e.key==='a') kbL=false;
  if(e.key==='ArrowRight'||e.key==='d') kbR=false;
});

// ---------- physics ----------
function step(dt){
  // 手动控制: 不拖动 / 不按键时, 角色只在原地直上直下, 不会自动找下一颗球
  // horizontal
  if(targetX!==null){
    p.x += (targetX-p.x)*Math.min(1, dt*22);
  } else if(kbL){ p.x -= 900*dt; }
  else if(kbR){ p.x += 900*dt; }
  // wrap
  if(p.x > W+PW/2) p.x = -PW/2;
  if(p.x < -PW/2) p.x = W+PW/2;
  // vertical
  var prevFeet = p.y + PH/2;
  p.vy += G*dt;
  p.y += p.vy*dt;
  var feet = p.y + PH/2;
  if(p.vy > 0){
    for(var i=0;i<plats.list.length;i++){
      var q=plats.list[i];
      if(q.gone) continue;                         // 已踩掉的球/币不再碰撞
      var half = platHalf(q);
      if(Math.abs(p.x-q.x) > half) continue;
      var top = platTop(q);                        // 球的顶端
      // 向下穿越判定: 上一帧脚在球顶之上、这一帧落到球顶之下即算踩中(不受下落速度影响, 不会穿透)
      if(prevFeet <= top + 2 && feet >= top){
        p.y = top - PH/2; p.vy = -JUMP; ding();
        if(q.type==='slide') coinBonus += 10;      // 踩到金币 +10m
        if(q.type!=='ground') q.gone = true;       // 球/币踩过即消失; 地面只作起跳台
        break;
      }
    }
  }
  // slide platforms
  for(var j=0;j<plats.list.length;j++){
    var s=plats.list[j];
    if(s.gone) continue;
    if(s.type==='slide'){
      s.x += s.vx*dt;
      if(s.x < 70){ s.x=70; s.vx=Math.abs(s.vx); }
      if(s.x > W-70){ s.x=W-70; s.vx=-Math.abs(s.vx); }
    }
  }
  // cull & generate
  while(plats.list.length && plats.list[0].y > camTop+H+260) plats.list.shift();
  genUpTo(camTop-500);
  // camera & altitude
  var line = p.y - H*0.42;
  if(line < camTop) camTop = line;
  var alt = altitudeOf(p.y);
  if(alt > maxAlt) maxAlt = alt;
  // death
  if(p.y - camTop > H + 120) gameOver();
}

// ---------- render ----------
function draw(){
  // 背景固定, 不随镜头滚动 (避免边界穿帮)
  if(imgBg.complete){ ctx.drawImage(imgBg, 0, 0, W, H); }
  ctx.save(); ctx.translate(0, -camTop);
  // platforms
  for(var i=0;i<plats.list.length;i++){
    var q=plats.list[i];
    if(q.gone) continue;                          // 已踩掉的不再绘制
    if(q.type==='ground'){
      ctx.fillStyle='#ffd633'; ctx.strokeStyle='#3a3a3a'; ctx.lineWidth=6;
      roundRect(q.x-250, q.y-26, 500, 44, 22); ctx.fill(); ctx.stroke();
    } else if(q.type==='slide'){
      ctx.drawImage(imgCoin, q.x-platCoinH/2, q.y-platCoinH, platCoinH, platCoinH);
    } else {
      ctx.drawImage(imgBall, q.x-platBallH/2, q.y-platBallH, platBallH, platBallH);
    }
  }
  // player
  ctx.drawImage(imgPlayer, p.x-PW/2, p.y-PH/2, PW, PH);
  ctx.restore();
  // HUD score
  ctx.font='900 46px system-ui,sans-serif'; ctx.textAlign='center';
  ctx.lineWidth=8; ctx.strokeStyle='rgba(255,255,255,.95)'; ctx.fillStyle='#333';
  var txt = scoreNow() + ' m';
  ctx.strokeText(txt, W/2, 92); ctx.fillText(txt, W/2, 92);
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
var lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  var dt=Math.min(.033,(t-lastT)/1000||0); lastT=t;
  if(ST==='play'){ step(dt); }
  if(ST==='play'||ST==='pause') draw();
}

// ---------- ui ----------
var ovStart=document.getElementById('ovStart'), ovPause=document.getElementById('ovPause'),
    ovOver=document.getElementById('ovOver'), hud=document.getElementById('hud');
document.getElementById('titleImg').src=IMG_TITLE;
function show(el,on){ el.classList.toggle('hidden',!on); }
function refreshBest(){
  document.getElementById('bestVal').textContent=best;
  document.getElementById('bestVal2').textContent=best;
}
function startGame(){
  reset(); ST='play';
  show(ovStart,false); show(ovOver,false); show(ovPause,false); hud.style.display='block';
  if(!muted){ bgm.currentTime=0; var pr=bgm.play(); if(pr&&pr.catch)pr.catch(function(){}); }
}
function gameOver(){
  ST='over'; hud.style.display='none'; targetX=null; bgm.pause();
  var sc = scoreNow();
  if(sc>best){ best=sc; localStorage.setItem('wm_best',best); }
  document.getElementById('scoreVal').textContent=sc; refreshBest();
  show(ovOver,true);
  var ov=document.getElementById('ovOver');
  ov.style.backgroundImage='url('+IMG_BG+')';
}
function goHome(){
  ST='start'; hud.style.display='none';
  show(ovOver,false); show(ovStart,true);
  var ov=document.getElementById('ovStart');
  ov.style.backgroundImage='url('+IMG_BG+')';
  refreshBest();
}
document.getElementById('btnStart').onclick=startGame;
document.getElementById('btnAgain').onclick=startGame;
document.getElementById('btnHome').onclick=goHome;
document.getElementById('btnRestart1').onclick=startGame;
document.getElementById('btnResume').onclick=function(){ ST='play'; show(ovPause,false);
  if(!muted) bgm.play().catch(function(){}); };
document.getElementById('btnPause').onclick=function(){
  if(ST==='play'){ ST='pause'; targetX=null; bgm.pause();
    var ov=document.getElementById('ovPause'); ov.style.backgroundImage='url('+IMG_BG+')';
    show(ovPause,true); }
};
var sndBtn=document.getElementById('btnSound');
function sndIcon(){ sndBtn.textContent = muted ? '🔇' : '🔊'; }
sndBtn.onclick=function(){ muted=!muted; localStorage.setItem('wm_mute',muted?'1':'0');
  sndIcon(); if(muted) bgm.pause(); else if(ST==='play'){ bgm.play().catch(function(){}); } };
sndIcon();
document.addEventListener('visibilitychange', function(){
  if(document.hidden && ST==='play'){ ST='pause'; targetX=null; bgm.pause();
    var ov=document.getElementById('ovPause'); ov.style.backgroundImage='url('+IMG_BG+')';
    show(ovPause,true); }
});
ovStart.style.backgroundImage='url('+IMG_BG+')';
refreshBest();
// debug hook (harmless): expose state for automated verification
window.__g = { alt:function(){ return maxAlt; }, y:function(){ return p?p.y:0; },
  st:function(){ return ST; }, plats:function(){ return plats?plats.list.length:0; },
  coin:function(){ return coinBonus; }, score:function(){ return scoreNow(); },
  nextX:function(){ var n=nearestAbove(p.y+PH/2); return n? n.x : null; },
  x:function(){ return p? p.x : 0; },
  feet:function(){ return p? p.y+PH/2 : 0; },
  vy:function(){ return p? p.vy : 0; },
  platsRaw:function(){ if(!plats) return []; return plats.list.map(function(o){ return {id:o.id, x:o.x, y:o.y, gone:!!o.gone, type:o.type}; }); },
  gone:function(){ var n=0; for(var i=0;i<plats.list.length;i++) if(plats.list[i].gone) n++; return n; },
  geom:function(){ var q={type:'normal', y:500}; return { top: platTop(q), bottom:q.y, ph:PH }; } };
requestAnimationFrame(loop);
}
)();
</script>
