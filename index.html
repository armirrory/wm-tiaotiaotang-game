<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WM跳跳糖</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#1a0f2e;
    font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;}
  #canvas{display:block;position:absolute;inset:0;width:100%;height:100%;}
  #loader{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;
    justify-content:center;align-items:center;color:#fff;
    background:radial-gradient(circle at 50% 35%,#3a1f5c,#150a28 70%);
    transition:opacity .5s ease;}
  #loader.hide{opacity:0;pointer-events:none;}
  .logo{font-size:34px;font-weight:800;letter-spacing:3px;margin-bottom:4px;
    background:linear-gradient(90deg,#ffd76e,#ff8a5c);-webkit-background-clip:text;
    background-clip:text;color:transparent;text-shadow:0 2px 18px rgba(255,150,80,.25);}
  .sub{font-size:13px;opacity:.65;margin-bottom:26px;}
  .spin{width:38px;height:38px;border-radius:50%;border:3px solid rgba(255,255,255,.18);
    border-top-color:#ffb14e;animation:sp 1s linear infinite;margin-bottom:20px;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .bar{width:230px;height:7px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden;}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd76e,#ff7a59);
    transition:width .25s ease;}
  .pct{margin-top:12px;font-size:13px;opacity:.85;font-variant-numeric:tabular-nums;}
  .msg{margin-top:14px;font-size:13px;color:#ff9a8b;max-width:82%;text-align:center;line-height:1.5;white-space:pre-line;}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="loader">
  <div class="logo">WM跳跳糖</div>
  <div class="sub">摘星小游戏 · 正在加载</div>
  <div class="spin"></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="pct" id="pct">准备中…</div>
  <div class="msg" id="msg"></div>
</div>
<script src="game.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"executable":"game","experimentalVK":false,"fileSizes":{"game.pck":11075176},"focusCanvas":true,"gdextensionLibs":[],"serviceWorker":false,"ensureCrossOriginIsolationHeaders":false};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);
const loader = document.getElementById('loader');
const bar = document.getElementById('bar');
const pct = document.getElementById('pct');
const msg = document.getElementById('msg');
const fmt = b => (b/1048576).toFixed(1) + ' MB';
function setProgress(cur, tot){
  if (tot > 0){
    const p = Math.min(100, Math.round(cur/tot*100));
    bar.style.width = p + '%';
    pct.textContent = '加载中 ' + p + '%  (' + fmt(cur) + ' / ' + fmt(tot) + ')';
  }
}
function hideLoader(){ loader.classList.add('hide'); setTimeout(() => loader.remove(), 600); }
(async () => {
  const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
  if (missing.length){
    pct.textContent = '当前浏览器暂不支持运行该游戏';
    msg.textContent = missing.join('\n');
    return;
  }
  try {
    await engine.startGame({ onProgress: (c, t) => setProgress(c, t) });
    hideLoader();
  } catch (e) {
    pct.textContent = '加载失败';
    msg.textContent = (e && e.message) ? e.message : String(e);
  }
})();
</script>
</body>
</html>
